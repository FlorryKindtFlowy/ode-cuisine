# De site draait op Cloudflare Pages. Cloudflare bouwt zelf bij elke wijziging op main.
# Deze workflow laat Cloudflare elke zondagochtend opnieuw bouwen, zodat het recept van die dag verschijnt.
# Nodig: secret CF_DEPLOY_HOOK (Cloudflare › ode-cuisine › Settings › Builds › Deploy hooks).
name: Site live zetten

on:
  schedule:
    - cron: '0 6 * * 0'   # zondag 06:00 UTC = 7u of 8u in België
  workflow_dispatch: {}

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare opnieuw laten bouwen
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
